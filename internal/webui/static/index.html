<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UFI-TOOLS U60 Pro RE</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main>
    <header><span class="badge">OPEN IMPLEMENTATION</span><h1>U60 Pro</h1><p>UFI-TOOLS-U60-PRO-RE</p></header>
    <section class="grid">
      <article><h2>服务</h2><strong id="service">检查中</strong><small id="version"></small></article>
      <article><h2>设备</h2><strong id="device">需要认证</strong><small id="network"></small></article>
      <article><h2>插件</h2><strong id="plugins">本地兼容层</strong><small>不默认连接第三方商店</small></article>
    </section>
    <section class="notice"><h2>安全状态</h2><p>旧式认证和远程 Shell 默认关闭。当前开发构建使用设备模拟器，尚未进行实机验证。</p></section>
    <nav class="tabs" aria-label="管理功能">
      <button data-tab="device-panel" class="active">设备</button>
      <button data-tab="hosts-panel">Hosts</button>
      <button data-tab="plugins-panel">插件</button>
      <button data-tab="tasks-panel">调度</button>
      <button data-tab="sms-panel">短信转发</button>
    </nav>
    <section id="device-panel" class="panel active">
      <h2>设备控制</h2>
      <div class="actions"><button id="refreshDevice">刷新状态</button><button id="startTTYD">启动 ttyd</button><button id="stopTTYD">停止 ttyd</button><button id="enableADB">启用网络 ADB</button><button id="disableADB">关闭网络 ADB</button></div>
      <pre id="deviceJson">等待加载</pre>
    </section>
    <section id="hosts-panel" class="panel">
      <h2>Hosts 管理</h2>
      <textarea id="hostsContent" rows="12" spellcheck="false" placeholder="127.0.0.1 localhost"></textarea>
      <div class="actions"><button id="loadHosts">读取</button><button id="saveHosts">保存并应用</button><button id="restoreHosts">恢复原文件</button></div>
    </section>
    <section id="plugins-panel" class="panel">
      <h2>插件管理</h2>
      <div class="actions"><button id="loadCatalog">刷新目录</button><button id="loadInstalled">已安装插件</button></div>
      <div id="pluginList" class="list"></div>
    </section>
    <section id="tasks-panel" class="panel">
      <h2>调度任务</h2>
      <input id="taskId" placeholder="任务 ID">
      <textarea id="taskData" rows="7" spellcheck="false">{"enabled":true,"next_unix":0,"action":{"type":"goform_set","key":"example","value":"1"}}</textarea>
      <div class="actions"><button id="saveTask">保存任务</button><button id="loadTasks">刷新列表</button></div>
      <pre id="taskList"></pre>
    </section>
    <section id="sms-panel" class="panel">
      <h2>短信转发</h2>
      <label><input id="smsEnabled" type="checkbox"> 启用轮询转发（需要服务以 workers 模式启动）</label>
      <select id="smsMethod"><option>CURL</option><option>DINGTALK</option><option>SMTP</option><option>SMS</option></select>
      <textarea id="smsConfig" rows="8" spellcheck="false" placeholder='{"url":"https://example.invalid/hook","body":"{{sms-from}}: {{sms-body}}"}'></textarea>
      <div class="actions"><button id="saveSMS">保存转发配置</button></div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
